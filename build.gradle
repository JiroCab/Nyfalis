def modlib = project.file("./build/libs/mods")
task runClientwithLocalMods{
    dependsOn runMindustryDesktop{
        mods.setFrom (tasks.jar)
        if(modlib.isDirectory()){
            modlib.listFiles().each{ f -> {
                if(f.isFile()) mods.from.add(f)
            }}
        }

        systemProperties.put("mindustry.debug", true)
        systemProperties.put("mindustry.editor.simulate.button", true)
    }

}
